<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FinSteady</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://kit.fontawesome.com/75d8a5f1bd.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/favicon.svg" alt="">
        <span class="sidebar-brand-testo">
          <span class="sidebar-brand-nome">FinSteady</span>
          <span class="sidebar-brand-tagline">Le tue finanze, senza sorprese.</span>
        </span>
      </div>
      <button type="button" class="btn-nuovo-movimento" id="btn-nuovo-sidebar">
        <i class="fa-solid fa-plus"></i> Nuovo movimento
      </button>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navigazione principale"></nav>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>

    <header class="topbar-mobile">
      <span class="topbar-mobile-brand">
        <img src="assets/favicon.svg" alt="">FinSteady
      </span>
      <div class="topbar-mobile-azioni" id="topbar-mobile-azioni"></div>
    </header>

    <main id="contenuto" class="contenuto"></main>

    <button type="button" class="fab-azioni" id="btn-fab" aria-label="Nuovo movimento">
      <i class="fa-solid fa-plus"></i>
    </button>

    <nav class="tabbar-mobile" id="tabbar-mobile" aria-label="Navigazione principale"></nav>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
